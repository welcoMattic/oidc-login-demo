# Authentik blueprint: provisions the OIDC provider, the application and the demo
# user for the Symfony OIDC login demo. Blueprints under /blueprints/custom are
# discovered and applied automatically by the authentik worker.
version: 1
metadata:
  name: symfony-oidc-demo
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: symfony_demo_provider
    identifiers:
      name: symfony-demo
    attrs:
      client_type: confidential
      client_id: authentik-demo-client
      client_secret: authentik-demo-secret
      # Recent authentik versions default grant_types to an empty list, which rejects
      # the authorization request with "Invalid grant_type for provider". It must be
      # declared explicitly for the Authorization Code Flow to work at all.
      grant_types:
        - authorization_code
        - refresh_token
      # The Symfony authenticator sends the callback as redirect_uri; it must match strictly.
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8001/authentik/callback
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    identifiers:
      slug: symfony-demo
    attrs:
      name: Symfony OIDC demo
      provider: !KeyOf symfony_demo_provider

  # Distinct demo user for this IdP (password is set by docker/authentik/provision.sh,
  # which the blueprint format cannot express).
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Authentik
      email: bob@authentik.demo
      is_active: true
      path: users
