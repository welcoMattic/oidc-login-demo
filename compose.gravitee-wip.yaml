# Gravitee Access Management: UNFINISHED, not part of the demo.
#
# The stack boots, but the security domain, the OIDC application and the demo user are
# not provisioned: authenticating against the management API to create them is unsolved
# (see the README). It is kept here because getting the stack to boot at all took a
# non-obvious finding, and because whoever finishes it should not have to redo that.
#
#   docker compose -f compose.gravitee-wip.yaml up -d
#
# Two things are still missing before it could serve the demo:
#   1. the provisioning described above;
#   2. HTTPS on the gateway, like the other IdPs (the authenticator requires the
#      announced token endpoint to use HTTPS). A Caddy front like the authentik one in
#      compose.idp.yaml is the shortest path.
#
# Note that Gravitee AM is still distributed as separate images (gateway, management
# API, UI) backed by MongoDB; there is no all-in-one AM image at 4.11.

services:
  gravitee_mongo:
    image: mongo:7
    volumes:
      - gravitee_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  gravitee_am_management:
    image: graviteeio/am-management-api:4.11.13
    environment: &gravitee_ds
      # gravitee.yml wires every repository to the ${ds.mongodb.*} placeholders
      # (defaulting to localhost), so these are the properties to override. The
      # gravitee_management_mongodb_uri form found in older guides is ignored here,
      # silently, and every repository then fails against localhost:27017.
      gravitee_ds_mongodb_host: gravitee_mongo
      gravitee_ds_mongodb_port: "27017"
      gravitee_ds_mongodb_dbname: gravitee-am
      # The shipped config disables the in-memory auth provider, so admin/adminadmin
      # cannot log into the management API. Enabling it did not unblock the login.
      gravitee_security_providers_0_enabled: "true"
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      gravitee_mongo:
        condition: service_healthy

  gravitee_am_gateway:
    image: graviteeio/am-gateway:4.11.13
    environment:
      <<: *gravitee_ds
      gravitee_http_cookie_secure: "false"
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      gravitee_mongo:
        condition: service_healthy

volumes:
  gravitee_mongo_data:
