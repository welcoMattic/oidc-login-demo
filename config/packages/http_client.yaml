# The OIDC login authenticator talks to the provider through the "http_client" service:
# the discovery document, the token endpoint, the UserInfo endpoint and the JWKS all go
# through it.
#
# The demo Identity Providers are served over HTTPS (the authenticator requires it for the
# token endpoint, which carries the authorization code and returns the tokens) with a
# certificate generated locally by docker/generate-certs.sh.
#
# "cafile" REPLACES the system CA bundle for every request the app makes, so it is pointed
# at a bundle holding the system roots plus the demo CA, not at the demo CA alone. TLS
# stays fully verified, for the IdPs and for the rest of the internet alike: no
# verify_peer: false anywhere in this demo.
framework:
    http_client:
        default_options:
            cafile: '%kernel.project_dir%/docker/certs/bundle.crt'
