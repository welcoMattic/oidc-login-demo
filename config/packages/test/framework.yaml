services:
    # Service for FakeKeycloak - this will be shared across all requests
    App\Tests\Oidc\FakeKeycloak:
        class: App\Tests\Oidc\FakeKeycloak
        arguments:
            # the MockClock of clock.yaml: the fake dates its tokens with the very clock
            # the firewall checks them against, so that moving it keeps both in step
            $clock: '@clock'

    # Replace the http_client service with our mock client that uses the shared FakeKeycloak
    http_client:
        class: Symfony\Component\HttpClient\MockHttpClient
        arguments:
            $responseFactory: '@App\Tests\Oidc\FakeKeycloak'

framework:
    cache:
        # Use array cache for tests to avoid filesystem persistence between test runs
        app: cache.adapter.array
