security:
    providers:
        # Shipped with the OIDC login feature: it builds a self-contained OidcUser from
        # the claims collected during authentication, and hands it back unchanged when the
        # session is refreshed. No database is involved anywhere in this demo.
        #
        # It deliberately refuses to let the claims define the security identity: the
        # identifier is always the claim the firewall configures (sub by default), a "roles" claim is dropped,
        # and roles stay [ROLE_USER]. Mapping claims onto roles is the job of your own
        # provider, implementing AttributesBasedUserProviderInterface: it receives every
        # claim as attributes.
        oidc:
            oidc: ~

        # Custom provider that maps Keycloak realm roles onto Symfony roles.
        keycloak_roles:
            id: App\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Seven oidc_login firewalls, one scenario each, all against the same Keycloak realm.
        # Each one lives under its own URL prefix (pattern) so the routes, the start
        # flow and the callback do not clash.

        # The baseline: only the required options are set, everything else relies on the
        # defaults. This is the smallest useful configuration.
        default:
            pattern: ^/default
            provider: oidc
            oidc_login:
                # The three required options. All of them accept environment variables.
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_CLIENT_SECRET)%'

                # Where the provider sends the user back. It must be registered as a
                # redirect URI with the provider, and the route for it comes from the
                # loader imported in config/routes/security.yaml.
                check_path: /default/callback
                start_path: /default/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /default/account
                failure_path: /

                # "openid" is always sent; these two are what make the provider return a
                # name and an email, which the account page displays.
                scope: [profile, email]

                # Defaults inherited when nothing else is set:
                # - pkce: { enabled: true, method: S256 } (Proof Key for Code Exchange)
                # - id_token_signature: { required: true, algorithms: [RS256], enforce_key_usage_verification: true }
                #   (the ID token signature is verified against the provider JWKS)
                # - discovery_cache_ttl: 3600 (the discovery document and JWKS are cached for one hour)
                # - allowed_time_drift: 0 (no clock skew tolerance when validating ID token time claims)
                # - max_age: not set (no re-authentication check)
                # - authorization_params: [] (no additional parameters on the authorization request)
                # The "openid" scope is always added to the authorization request.

                # Enable RP-Initiated Logout: the bundle registers OidcEndSessionListener on the
                # firewall's own event dispatcher at priority 65: on logout it redirects to the
                # provider end_session_endpoint with id_token_hint and post_logout_redirect_uri.
                # The Keycloak clients register http://localhost:8001/* as post logout redirect URI.
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /default/logout
                target: /

        # Same as default, but the client secret travels as HTTP Basic credentials
        # (RFC 6749, Section 2.3.1) instead of in the request body.
        basic:
            pattern: ^/basic
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'

                # HTTP Basic authentication at the token endpoint: the client_id is the
                # username, the client_secret the password, per RFC 6749, Section 2.3.1,
                # which is the method the RFC recommends.
                client_authentication:
                    client_secret_basic: '%env(OIDC_CLIENT_SECRET)%'

                check_path: /basic/callback
                start_path: /basic/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /basic/account
                failure_path: /
                scope: [profile, email]

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /basic/logout
                target: /
            # Defaults are the same as for the "default" firewall: PKCE enabled with S256,
            # ID token signature verified with RS256, discovery cache TTL 3600, no time drift.

        # A public client: it holds no secret, so it authenticates at the token endpoint with
        # nothing but its client_id, and PKCE is the only thing binding the authorization code
        # to it. Declaring it is what "client_authentication: none" does, and that is why
        # "pkce.enabled: false" and "id_token_signature.required: false" are then refused at
        # compile time.
        public:
            pattern: ^/public
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_PUBLIC_CLIENT_ID)%'

                # The one method that takes no parameter, and the only value the option
                # accepts as a bare string: no secret is sent to the token endpoint, which
                # is what makes this a public client.
                client_authentication: none

                check_path: /public/callback
                start_path: /public/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /public/account
                failure_path: /
                scope: [profile, email]

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /public/logout
                target: /

        # Every option shaping the authorization request and the ID token checks, set explicitly.
        strict:
            pattern: ^/strict
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_CLIENT_SECRET)%'
                check_path: /strict/callback
                start_path: /strict/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /strict/account
                failure_path: /
                scope: [profile, email]

                # max_age makes the authenticator send a "max_age" parameter on the
                # authorization request, and then require and check the "auth_time" claim
                # in the ID token: the user must have authenticated with the provider no more
                # than this many seconds ago.
                max_age: 60

                # allowed_time_drift tolerates this many seconds of clock skew between
                # the host and the provider when validating the ID token time claims.
                allowed_time_drift: 5

                # discovery_cache_ttl: the discovery document and the JWKS (when it announces
                # no cache lifetime itself) are cached for this many seconds.
                discovery_cache_ttl: 60

                # authorization_params sends these additional parameters on the authorization
                # request. They cannot set response_type, client_id, redirect_uri, scope, state,
                # nonce, code_challenge, code_challenge_method or max_age (rejected at compile time).
                authorization_params:
                    prompt: login
                    login_hint: alice
                    ui_locales: fr

                # ID token signature verification: the token must be signed with one of these
                # algorithms, and only keys marked for signing are accepted.
                id_token_signature:
                    required: true
                    algorithms: [RS256]
                    enforce_key_usage_verification: true

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /strict/logout
                target: /
            # Effects of the above: prompt=login forces Keycloak to ask for the password again
            # even with a live SSO session; login_hint prefills the username; ui_locales=fr
            # switches the Keycloak login page to French; max_age=60 requires the auth_time claim
            # in the ID token, and the login must be no older than 60 seconds.

        # A client that signs its ID tokens with ES256 instead of RS256. The default
        # allowlist [RS256] would reject them; accepted values are RS256, RS384, RS512,
        # ES256, ES384, ES512, PS256, PS384, PS512. Never an HMAC one.
        es256:
            pattern: ^/es256
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_ES256_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_ES256_CLIENT_SECRET)%'
                check_path: /es256/callback
                start_path: /es256/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /es256/account
                failure_path: /
                scope: [profile, email]

                id_token_signature:
                    algorithms: [ES256]

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /es256/logout
                target: /

        # PKCE with the plain method: only for a provider that supports nothing else.
        # RFC 7636, Section 4.2 mandates S256 otherwise; the code_challenge is then the
        # verifier itself.
        plain:
            pattern: ^/plain
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_PLAIN_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_PLAIN_CLIENT_SECRET)%'
                check_path: /plain/callback
                start_path: /plain/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /plain/account
                failure_path: /
                scope: [profile, email]

                pkce:
                    enabled: true
                    method: plain

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /plain/logout
                target: /

        # Mapping Keycloak realm roles onto Symfony roles with a custom user provider.
        # The built-in "oidc" provider never lets a claim grant a role (every user gets
        # ROLE_USER); mapping claims onto roles is the job of a user provider implementing
        # AttributesBasedUserProviderInterface, which receives every claim as its second
        # argument. This firewall uses the keycloak_roles provider defined above.
        roles:
            pattern: ^/roles
            provider: keycloak_roles
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_CLIENT_SECRET)%'
                check_path: /roles/callback
                start_path: /roles/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /roles/account
                failure_path: /
                scope: [profile, email, roles]

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /roles/logout
                target: /

        # The claims are read from the validated ID token instead of the UserInfo endpoint.
        # Keycloak puts the profile and email claims in the ID token; the userinfo_endpoint
        # is not even required to be announced; the sub cross-check with UserInfo does not apply.
        # Named "idtoken" and not "id_token": the bundle registers the authenticator of a
        # firewall as security.authenticator.oidc_login.<firewall>, and its helper services
        # under the same prefix (security.authenticator.oidc_login.id_token, .discovery,
        # .client...), so a firewall named after one of them collides with it and the
        # container reports a circular reference.
        idtoken:
            pattern: ^/idtoken
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_CLIENT_SECRET)%'
                check_path: /idtoken/callback
                start_path: /idtoken/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /idtoken/account
                failure_path: /
                scope: [profile, email]

                # Read claims from the ID token instead of UserInfo endpoint.
                user_data_source: id_token

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /idtoken/logout
                target: /

        # The identity becomes the email claim instead of the sub UUID.
        # Only for a provider that guarantees the claim is unique and stable;
        # the built-in provider builds the OidcUser on that identifier;
        # the login fails if the claim is missing.
        email:
            pattern: ^/email
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_PROVIDER_URI)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                client_authentication:
                    client_secret_post: '%env(OIDC_CLIENT_SECRET)%'
                check_path: /email/callback
                start_path: /email/start

                # Where a successful login lands, and where a failed one goes. failure_path
                # matters: it defaults to login_path (/login), which this application does not
                # have, so a failure would end on a 404 instead of the home page and its banner.
                default_target_path: /email/account
                failure_path: /
                scope: [profile, email]

                # Use email claim as the user identifier instead of sub.
                user_identifier_claim: email

                # Enable RP-Initiated Logout (the core OidcEndSessionListener replaces the app listener).
                enable_end_session: true
                post_logout_redirect_path: /
            logout:
                path: /email/logout
                target: /

        # Public catch-all: the scenario catalogue and anything outside a scenario prefix.
        main:
            lazy: true
            provider: oidc

    access_control:
        # The callback must stay public: the user is anonymous when the provider sends
        # them back, and the firewall authenticates them from that very request.
        - { path: ^/default/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/basic/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/public/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/strict/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/es256/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/plain/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/roles/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/email/(start|callback)$, roles: PUBLIC_ACCESS }
        - { path: ^/idtoken/(start|callback)$, roles: PUBLIC_ACCESS }

        # Requiring a role here is what triggers the redirect to the provider: the
        # entry point of an oidc_login firewall always redirects straight to it.
        - { path: ^/default, roles: ROLE_USER }
        - { path: ^/basic, roles: ROLE_USER }
        - { path: ^/public, roles: ROLE_USER }
        - { path: ^/strict, roles: ROLE_USER }
        - { path: ^/es256, roles: ROLE_USER }
        - { path: ^/plain, roles: ROLE_USER }
        - { path: ^/roles, roles: ROLE_USER }
        - { path: ^/email, roles: ROLE_USER }
        - { path: ^/idtoken, roles: ROLE_USER }