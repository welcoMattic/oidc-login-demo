security:
    # OIDC users are self-contained (all claims come from the provider), so no
    # password hashing is needed. The hasher config is kept for completeness.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Provided by the OIDC login backbone: refreshes the session-stored OidcUser.
        oidc:
            oidc: ~

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # One firewall per OIDC provider: the backbone is one-provider-per-firewall,
        # so each firewall owns a distinct URL prefix + callback + entry point.
        #
        # NOTE: values are inlined, not '%env(...)%'. The backbone declares
        # provider_uri/client_id/client_secret with ->cannotBeEmpty(), and Symfony
        # forbids environment variables on such nodes ("cannot contain an environment
        # variable when empty values are not allowed by definition"). These are
        # throwaway secrets for local demo IdPs only.
        keycloak:
            pattern: ^/keycloak
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_KEYCLOAK_PROVIDER_URI)%'
                client_id: '%env(OIDC_KEYCLOAK_CLIENT_ID)%'
                client_secret: '%env(OIDC_KEYCLOAK_CLIENT_SECRET)%'
                check_path: /keycloak/callback
                default_target_path: /keycloak
                # without this a failed login redirects to /login, which does not exist
                failure_path: /
            logout:
                path: /keycloak/logout
                target: /

        authentik:
            pattern: ^/authentik
            provider: oidc
            oidc_login:
                provider_uri: '%env(OIDC_AUTHENTIK_PROVIDER_URI)%'
                client_id: '%env(OIDC_AUTHENTIK_CLIENT_ID)%'
                client_secret: '%env(OIDC_AUTHENTIK_CLIENT_SECRET)%'
                check_path: /authentik/callback
                default_target_path: /authentik
                # without this a failed login redirects to /login, which does not exist
                failure_path: /
            logout:
                path: /authentik/logout
                target: /

        gravitee:
            pattern: ^/gravitee
            provider: oidc
            oidc_login:
                provider_uri: 'http://localhost:8092/demo/oidc'
                client_id: 'changeme'
                client_secret: 'changeme'
                check_path: /gravitee/callback
                default_target_path: /gravitee
                # without this a failed login redirects to /login, which does not exist
                failure_path: /
            logout:
                path: /gravitee/logout
                target: /

        # Public catch-all (chooser page and anything not under a provider prefix).
        main:
            lazy: true
            provider: oidc

    access_control:
        - { path: ^/keycloak/callback, roles: PUBLIC_ACCESS }
        - { path: ^/authentik/callback, roles: PUBLIC_ACCESS }
        - { path: ^/gravitee/callback, roles: PUBLIC_ACCESS }
        - { path: ^/keycloak, roles: ROLE_USER }
        - { path: ^/authentik, roles: ROLE_USER }
        - { path: ^/gravitee, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
