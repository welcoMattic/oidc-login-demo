_security_logout:
    resource: security.route_loader.logout
    type: service

# Imported by the security-bundle recipe (symfony/recipes#1569): the route loader
# declares the check_path and the start_path of every oidc_login firewall. Without
# this import the provider redirect lands on an unrouted /<fw>/callback and 404s.
_security_oidc_login:
    resource: security.authenticator.oidc_login.route_loader
    type: service

# Custom callback route for the callback scenario: check_path is a route name
# (app_callback_return) instead of a path, so the loader declares nothing for it
# and the application defines the route itself.
app_callback_return:
    path: /callback/return-from-keycloak
    # No controller: the authenticator handles every request on its check path
