# OIDC Identity Providers for the demo.
#
# Each IdP is behind a Compose profile so they can be started independently
# (16 GB is enough for one or two at a time, tight for all three):
#
#   docker compose -f compose.idp.yaml --profile keycloak up -d
#   docker compose -f compose.idp.yaml --profile authentik up -d
#   docker compose -f compose.idp.yaml --profile gravitee up -d
#
# All IdPs are published on 127.0.0.1 so the browser AND the Symfony backend
# reach them at the exact same host:port: the discovery "issuer" then matches
# the configured provider_uri (mandatory for the OIDC login authenticator).

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/demo/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q issuer"]
      interval: 10s
      timeout: 5s
      retries: 30
    profiles: ["keycloak", "all"]

  # ---------------------------------------------------------------- Authentik
  authentik_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    volumes:
      - authentik_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["authentik", "all"]

  authentik_redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["authentik", "all"]

  authentik:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: demo-only-not-a-real-secret-key-0123456789
      AUTHENTIK_POSTGRESQL__HOST: authentik_db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin12345
      AUTHENTIK_BOOTSTRAP_TOKEN: demo-bootstrap-token
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@authentik.demo
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    ports:
      # 9000 on the host is commonly taken by php-fpm; authentik derives its issuer
      # from the request host, so it announces http://localhost:9100/... here.
      - "127.0.0.1:9100:9000"
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    profiles: ["authentik", "all"]

  authentik_worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: worker
    environment: *authentik_env
    volumes:
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    profiles: ["authentik", "all"]

  # -------------------------------------------------------------- Gravitee AM
  # Gravitee Access Management is still split into separate images (gateway +
  # management API + UI) backed by MongoDB; there is no single all-in-one AM image.
  # The UI is skipped here: provisioning goes through the management API.
  gravitee_mongo:
    image: mongo:7
    volumes:
      - gravitee_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
    profiles: ["gravitee", "all"]

  gravitee_am_management:
    image: graviteeio/am-management-api:4.11.13
    environment: &gravitee_ds
      # gravitee.yml wires every repository to the ${ds.mongodb.*} placeholders
      # (defaulting to localhost), so these are the properties to override. The
      # gravitee_management_mongodb_uri form found in older guides is ignored here.
      gravitee_ds_mongodb_host: gravitee_mongo
      gravitee_ds_mongodb_port: "27017"
      gravitee_ds_mongodb_dbname: gravitee-am
      # The shipped config disables the in-memory auth provider, so admin/adminadmin
      # cannot log into the management API. Enable it to allow API provisioning.
      gravitee_security_providers_0_enabled: "true"
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      gravitee_mongo:
        condition: service_healthy
    profiles: ["gravitee", "all"]

  gravitee_am_gateway:
    image: graviteeio/am-gateway:4.11.13
    environment:
      <<: *gravitee_ds
      gravitee_http_cookie_secure: "false"
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      gravitee_mongo:
        condition: service_healthy
    profiles: ["gravitee", "all"]

volumes:
  authentik_db_data:
  gravitee_mongo_data:
