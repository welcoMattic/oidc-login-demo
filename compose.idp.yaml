# OIDC Identity Providers for the demo.
#
# Everything is started for you by "make start". To drive Compose directly:
#
#   docker compose -f compose.idp.yaml --profile keycloak up -d --wait
#   docker compose -f compose.idp.yaml --profile gravitee up -d --wait
#
# Two rules shape this file:
#
# 1. Every IdP is served over HTTPS. The authenticator requires the token endpoint
#    announced by the provider to use HTTPS, since that leg carries the authorization
#    code and returns the tokens, which rules out serving a local IdP over plain HTTP.
#    The certificate comes from docker/generate-certs.sh.
#
# 2. Every IdP is published on 127.0.0.1 so the browser and the Symfony backend reach
#    it at the very same host:port: the "issuer" in the discovery document then matches
#    the configured provider_uri, which the authenticator checks.
#

services:
  # ---------------------------------------------------------------- Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # HTTP stays enabled inside the container for the healthcheck below; only the
      # HTTPS port is published, so the announced issuer is always the https one.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTPS_CERTIFICATE_FILE: /certs/idp.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/idp.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
      - ./docker/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/demo/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q issuer"]
      interval: 5s
      timeout: 5s
      retries: 40
    profiles: ["keycloak", "all"]

  # ---------------------------------------------------------------- Gravitee AM
  # Built from the official Compose recipe (docs: Gravitee AM, run in Docker), trimmed
  # to what the demo needs. Three moving parts: MongoDB, the gateway (the OIDC provider
  # itself) and the management API (used only by docker/gravitee/provision.sh).
  gravitee_mongo:
    # the official recipe pins mongo:4.2, which is EOL and only runs under emulation on
    # an arm64 host; 7 is supported by AM 4.x and runs natively
    image: mongo:7
    volumes:
      - gravitee_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: ["gravitee", "all"]

  gravitee_gateway:
    image: graviteeio/am-gateway:4
    environment: &gravitee_mongo_uri
      gravitee_repositories_management_mongodb_uri: mongodb://gravitee_mongo:27017/graviteeam
      gravitee_repositories_oauth2_mongodb_uri: mongodb://gravitee_mongo:27017/graviteeam
      gravitee_repositories_gateway_mongodb_uri: mongodb://gravitee_mongo:27017/graviteeam
    depends_on:
      gravitee_mongo:
        condition: service_healthy
    profiles: ["gravitee", "all"]

  gravitee_management:
    image: graviteeio/am-management-api:4
    environment:
      <<: *gravitee_mongo_uri
      # AM 4.x requires a data plane, and a domain cannot be created without naming it.
      # "default" here is the id provision.sh sends as dataPlaneId.
      gravitee_dataPlanes_0_id: default
      gravitee_dataPlanes_0_type: mongodb
      gravitee_dataPlanes_0_mongodb_uri: mongodb://gravitee_mongo:27017/graviteeam
    ports:
      # Plain HTTP, for the provisioning script and the management UI only. The app never
      # touches this port: it goes through the TLS front below.
      - "127.0.0.1:8093:8093"
    depends_on:
      gravitee_mongo:
        condition: service_healthy
    profiles: ["gravitee", "all"]

  gravitee_ui:
    image: graviteeio/am-management-ui:4
    environment:
      # the browser calls the management API directly, so this is a host URL
      MGMT_API_URL: http://localhost:8093
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      - gravitee_management
    profiles: ["gravitee", "all"]

  gravitee_tls:
    image: caddy:2-alpine
    volumes:
      - ./docker/gravitee/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
    ports:
      - "127.0.0.1:9443:9443"
    depends_on:
      - gravitee_gateway
    profiles: ["gravitee", "all"]

volumes:
  gravitee_mongo_data:
