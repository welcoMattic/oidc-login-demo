# OIDC Identity Providers for the demo.
#
# Everything is started for you by "make start". To drive Compose directly:
#
#   docker compose -f compose.idp.yaml --profile keycloak up -d --wait
#   docker compose -f compose.idp.yaml --profile authentik up -d --wait
#
# Two rules shape this file:
#
# 1. Every IdP is served over HTTPS. The authenticator requires the token endpoint
#    announced by the provider to use HTTPS (the ID token signature is not verified,
#    so the transport is what makes the token trustworthy), which rules out serving a
#    local IdP over plain HTTP. The certificate comes from docker/generate-certs.sh.
#
# 2. Every IdP is published on 127.0.0.1 so the browser and the Symfony backend reach
#    it at the very same host:port: the "issuer" in the discovery document then matches
#    the configured provider_uri, which the authenticator checks.
#
# An unfinished Gravitee AM stack lives in compose.gravitee-wip.yaml.

services:
  # ---------------------------------------------------------------- Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # HTTP stays enabled inside the container for the healthcheck below; only the
      # HTTPS port is published, so the announced issuer is always the https one.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTPS_CERTIFICATE_FILE: /certs/idp.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/idp.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
      - ./docker/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/demo/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q issuer"]
      interval: 5s
      timeout: 5s
      retries: 40
    profiles: ["keycloak", "all"]

  # ---------------------------------------------------------------- Authentik
  authentik_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    volumes:
      - authentik_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["authentik", "all"]

  authentik_redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["authentik", "all"]

  authentik:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: demo-only-not-a-real-secret-key-0123456789
      AUTHENTIK_POSTGRESQL__HOST: authentik_db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin12345
      AUTHENTIK_BOOTSTRAP_TOKEN: demo-bootstrap-token
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@authentik.demo
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    ports:
      # Plain HTTP, for the provisioning script only (9000 on the host is commonly taken
      # by php-fpm). The app never uses this port: it goes through the TLS front below,
      # and authentik derives the issuer it announces from that request.
      - "127.0.0.1:9100:9000"
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    profiles: ["authentik", "all"]

  authentik_worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: worker
    environment: *authentik_env
    volumes:
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik_db:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    profiles: ["authentik", "all"]

  # authentik terminates TLS with a certificate of its own making, which nothing else
  # trusts; this puts the demo certificate in front of it instead. Keycloak needs no
  # equivalent: it serves HTTPS itself from the same files.
  authentik_tls:
    image: caddy:2-alpine
    volumes:
      - ./docker/authentik/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
    ports:
      - "127.0.0.1:9443:9443"
    depends_on:
      - authentik
    profiles: ["authentik", "all"]

volumes:
  authentik_db_data:
